<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لمى الجهني</title>
<script>
/* Phones and tablets open the page directly: it declares a fixed 1280px
   layout, so the browser shows the whole design zoomed to fit. */
if(matchMedia('(hover:none) and (pointer:coarse)').matches||Math.max(screen.width,screen.height)<900){location.replace('site.html?v=14');}
</script>
<style>html,body{margin:0;height:100%;background:#0b140c}
body{overflow:hidden}
#f{position:absolute;top:0;left:0;border:0;transform-origin:0 0;display:block}</style>
</head><body>
<iframe id="f" src="site.html?v=14" title="لمى الجهني" allow="fullscreen; autoplay"></iframe>
<script>
/* Desktop: the design is locked at 1280px wide and scaled uniformly to the window. */
(function(){var D=1280,f=document.getElementById('f');
function fit(){var w=document.documentElement.clientWidth,h=window.innerHeight,s=w/D;
 f.style.width=D+'px';f.style.height=(h/s)+'px';f.style.transform='scale('+s+')';}
fit();addEventListener('resize',fit);})();
</script>
</body></html>
