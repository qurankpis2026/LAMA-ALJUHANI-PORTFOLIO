<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لمى الجهني</title>
<style>html,body{margin:0;height:100%;background:#0b140c}
body{overflow-x:auto;overflow-y:hidden}
#f{position:absolute;top:0;left:0;border:0;transform-origin:0 0;display:block}</style>
</head><body>
<iframe id="f" src="site.html" title="لمى الجهني" allow="fullscreen; autoplay"></iframe>
<script>
/* Design is locked at 1280px wide: it never reflows and never shrinks.
   Wider screens scale it up proportionally; narrower screens keep it at
   full size and scroll sideways. */
(function(){var D=1280,f=document.getElementById('f'),b=document.body;
function fit(){var w=document.documentElement.clientWidth,h=window.innerHeight,s=Math.max(1,w/D);
 f.style.width=D+'px';f.style.height=(h/s)+'px';f.style.transform=s>1?'scale('+s+')':'none';
 b.style.width=(D*s)+'px';}
fit();addEventListener('resize',fit);addEventListener('orientationchange',function(){setTimeout(fit,200)});})();
</script>
</body></html>
